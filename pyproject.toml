[project]
name = "ppo-cartpole"
version = "0.1.0"
description = "PPO CartPole training notebook project"
requires-python = ">=3.10"
dependencies = [
  "gymnasium[classic-control]>=1.3.0",
  "torch>=2.14.0",
  "matplotlib>=3.11.2",
  "numpy>=2.5.3",
  "pygame>=2.5.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
